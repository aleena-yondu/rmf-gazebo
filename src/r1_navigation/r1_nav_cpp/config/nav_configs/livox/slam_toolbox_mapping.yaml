slam_toolbox:
  ros__parameters:
    # === Plugin params (stock) ===
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Cap Ceres pose-graph optimizer threads. Stock slam_toolbox hardcoded
    # this at 50 (capped to 8 by Ceres on this Jetson = all cores) which
    # starved the sensor container during optimization and caused 50%+
    # IMU back-clamp warnings in pointcloud_deskew during mapping. Reading
    # this YAML key requires our local patch to solvers/ceres_solver.cpp
    # (declare_parameter("ceres_num_threads", 4)) -- if you build a stock
    # slam_toolbox the key is silently ignored. Mirror in localization +
    # lifelong YAMLs.
    ceres_num_threads: 8

    # === ROS topology (robot-specific) ===
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    map_start_pose: [0.0, 0.0, 0.0]
    use_map_saver: true

    # Required for /slam_toolbox/toggle_interactive_mode + draggable markers.
    enable_interactive_mode: true
    debug_logging: false
    throttle_scans: 1

    # 10 Hz to match LIVOX MID-360 native rate.
    transform_publish_period: 0.1
    map_update_interval: 5.0
    resolution: 0.05

    # === Sensor model (robot/site-specific) ===
    # MID-360 reliable range against warehouse metal racks. Spec is 40 m at
    # 10% reflectivity; we cap at 28 m to stay well inside the dim-target
    # SNR regime while still seeing aisle endcaps from mid-aisle in our
    # ~55 m featureless aisles. (Was 18 m, which left the matcher blind to
    # endcap features over ~60% of each aisle traversal -- pure aliasing.)
    # MUST be mirrored in slam_toolbox_localization.yaml + slam_toolbox_lifelong.yaml
    # so the matcher sees the same footprint across modes; AND the upstream
    # pointcloud_to_laserscan range_max in launch/*.py must be >= this with
    # a 4 m headroom for mapping/lifelong, 2 m for localization.
    min_laser_range: 0.3
    max_laser_range: 28.0
    minimum_time_interval: 0.1

    # 0.3 s tolerates brief EKF/TF jitter (USB hiccup, ZED restart).
    transform_timeout: 0.3
    tf_buffer_duration: 30.

    # GPA-class graph (~1500-2000 nodes) bumped from 40 MB stock default;
    # 40 MB was borderline for serialize. Mirror in localization + lifelong.
    stack_size_to_use: 120000000

    # === General params ===
    use_scan_matching: true
    use_scan_barycenter: true
    # 0.5/0.5 -> 0.25/0.25 (2026-05-20): build a denser graph now that
    # the LIVOX input scan is SE(2)-deskewed. The old 0.5 m / 28.6 deg
    # spacing was adequate for coarse maps, but left long featureless aisle
    # sections with sparse frozen anchors in localization mode. 0.25 keeps
    # localization priors tighter without changing the occupancy resolution.
    minimum_travel_distance: 0.25
    minimum_travel_heading: 0.25
    # Match localization's precise distance/heading gate so mapping and
    # localization trigger scan matching on the same physical motion.
    check_min_dist_and_heading_precisely: true
    scan_buffer_size: 10
    # Tracks max_laser_range (must match it).
    scan_buffer_maximum_scan_distance: 28.0
    # 0.1 was stock-loose and allowed noisy local matches while mapping.
    # Use the same strict-but-not-brittle gate as localization so bad
    # featureless-aisle matches abstain instead of being baked into the graph.
    link_match_minimum_response_fine: 0.40
    # 1.5 -> 3.0: give both mapping and localization enough frozen/local
    # graph neighborhood when the EKF prior is off by >1.5 m after long
    # featureless aisles, without opening the correlation search window.
    link_scan_maximum_distance: 3.0
    # 6.0 (>aisle pitch ~5-6 m) so revisits from adjacent aisle entries
    # actually enter the loop-candidate list. Stock 3.0 under-closes here.
    loop_search_maximum_distance: 4.0
    do_loop_closing: true
    # 8 (stock 10) admits more candidate chains on revisits; response gates
    # below (0.45/0.45) still filter aliased aisle matches.
    loop_match_minimum_chain_size: 8
    loop_match_maximum_variance_coarse: 3.0
    # Coarse gate raised to match fine threshold. Parallel rack walls in
    # adjacent aisles routinely score >0.35 coarse (perceptual aliasing);
    # 0.45 cuts false positives without blocking legitimate revisits.
    loop_match_minimum_response_coarse: 0.45
    # Fine eased to 0.42 (from 0.45) for a few more closures; coarse stays at
    # 0.45 so the aisle-aliasing pre-filter still rejects parallel-rack matches.
    loop_match_minimum_response_fine: 0.42

    # === Correlation params ===
    # Match localization. 0.8 m dimension = +/-0.4 m search radius: tight
    # enough to avoid adjacent repeated rack-pillar aliases while allowing
    # the denser 0.25 m graph to correct modest EKF drift.
    correlation_search_space_dimension: 0.8
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # === Loop closure correlation grid (slam_toolbox stock) ===
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # === Scan matcher params (slam_toolbox stock) ===
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true

    # Occupancy raster: stricter than stock (2/0.1) so first map has minimal
    # transient contamination from forklifts/people. Lifelong stays at stock.
    min_pass_through: 3
    occupancy_threshold: 0.25
