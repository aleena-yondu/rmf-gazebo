amcl:
  ros__parameters:
    use_sim_time: false

    # Particle filter
    min_particles: 500
    max_particles: 2000
    resample_interval: 1
    pf_err: 0.05
    pf_z: 0.99

    # Motion model — OmniMotionModel for synchro drive
    robot_model_type: "nav2_amcl::OmniMotionModel"
    alpha1: 0.2 # rotation noise from rotation
    alpha2: 0.2 # rotation noise from translation
    alpha3: 0.2 # translation noise from translation
    alpha4: 0.2 # translation noise from rotation
    alpha5: 0.2 # strafe noise (omni only)

    # Laser model
    laser_model_type: "likelihood_field"
    laser_max_range: 100.0
    laser_min_range: -1.0
    max_beams: 60
    laser_likelihood_max_dist: 2.0
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    sigma_hit: 0.2
    lambda_short: 0.1

    # Frames
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link"
    scan_topic: /ouster/scan

    # Update thresholds
    update_min_d: 0.25 # meters moved before updating
    update_min_a: 0.2 # radians rotated before updating
    transform_tolerance: 1.0
    tf_broadcast: true

    # Recovery
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0

    save_pose_rate: 0.5
    set_initial_pose: false
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
